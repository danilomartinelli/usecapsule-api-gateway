[package]
name = "capsule-data-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "http2"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = "0.1"

# HTTP client for proxying
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
tracing-opentelemetry = "0.22"

# Metrics
prometheus = "0.13"

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"

# Rate limiting
governor = "0.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
once_cell = "1.19"

# Plugin system (WASM)
wasmtime = { version = "17.0", optional = true }

# Circuit breaker
failsafe = "1.3"

[dev-dependencies]
mockito = "1.2"
criterion = "0.5"

[features]
default = []
wasm-plugins = ["wasmtime"]

[[bin]]
name = "data-plane"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
